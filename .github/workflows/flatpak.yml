name: Flatpak CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 eisenhower_matrix/ tests/ --max-line-length=120 --extend-ignore=E203,W503
        continue-on-error: true

      - name: Check formatting with black
        run: black --check eisenhower_matrix/ tests/
        continue-on-error: true

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest -v

  validate:
    name: Validate desktop and metainfo files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop file
        run: desktop-file-validate io.github.alesima.eisenhower.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net io.github.alesima.eisenhower.metainfo.xml

  flatpak-builder:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: eisenhower-matrix.flatpak
          manifest-path: io.github.alesima.eisenhower.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # Same mirroring Flathub infra performs; required for repo lint
          mirror-screenshots-url: https://dl.flathub.org/media

      - name: Lint manifest and build
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.alesima.eisenhower.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: eisenhower-matrix-flatpak
          path: eisenhower-matrix.flatpak
          retention-days: 30
